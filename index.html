<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>书房 · 读书复盘</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ECEEEA;--panel:#F7F8F5;--ink:#1D2A2B;--sub:#5E6B6A;--line:#CBD0CA;--acc:#2F5D58;--acc-ink:#fff;--mark:#E6DDBF;--done:#8A6D3B;--done-bg:#F1ECDD;--acc-bg:#E3ECE9;--coach:#4A5E9A;--coach-bg:#E8ECF6;--serif:"Noto Serif SC","Songti SC","Source Han Serif SC",serif;--sans:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151B1B;--panel:#1C2424;--ink:#E4E8E3;--sub:#92A09E;--line:#2F3B3A;--acc:#7FB5AC;--acc-ink:#0F1616;--mark:#3A3722;--done:#B8955A;--done-bg:#2A2819;--acc-bg:#1F2D2A;--coach:#9DB1E6;--coach-bg:#1E2438;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151B1B;--panel:#1C2424;--ink:#E4E8E3;--sub:#92A09E;--line:#2F3B3A;--acc:#7FB5AC;--acc-ink:#0F1616;--mark:#3A3722;--done:#B8955A;--done-bg:#2A2819;--acc-bg:#1F2D2A;--coach:#9DB1E6;--coach-bg:#1E2438;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.85 var(--serif)}
.wrap{max-width:720px;margin:0 auto;padding:20px 20px 80px}
header{display:flex;align-items:baseline;gap:20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:28px}

nav a.on{color:var(--ink);border-bottom:2px solid var(--acc)}
nav a:hover,.lnk:hover{color:var(--ink)}
h2{font-size:15px;font-weight:600;color:var(--sub);margin:36px 0 10px;font-family:var(--sans)}
h3{font-size:26px;margin:0 0 4px;line-height:1.4;font-weight:600}
.meta{font:13px var(--sans);color:var(--sub)}
.row{display:block;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;cursor:pointer}
.row:hover .rt{color:var(--acc)}
.rt{font-weight:600;font-size:18px}
.snip{color:var(--sub);font-size:15px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.resurface p{margin:8px 0}
button.pri,button.sec{font:15px var(--sans);padding:9px 18px;border-radius:4px;cursor:pointer;border:1px solid var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink)}
button.sec{background:transparent;color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea,select{width:100%;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:9px 12px}
textarea{resize:vertical;line-height:1.8}
label{display:block;font:13px var(--sans);color:var(--sub);margin:18px 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.q{background:var(--mark);padding:10px 14px;margin:8px 0;border-radius:3px;font-size:15.5px}
.q small{display:block;font:12px var(--sans);color:var(--sub)}
.qrow{display:grid;grid-template-columns:1fr 84px 32px;gap:8px;margin-bottom:8px;align-items:start}
.cn{color:var(--acc);text-decoration:none;border-bottom:1px dotted var(--acc)}
.coach{margin-top:20px;border-top:1px solid var(--line);padding-top:6px;white-space:pre-wrap;font-size:16px}
.empty{color:var(--sub);padding:28px 0;font-size:16px}
blockquote{margin:12px 0;padding:2px 0 2px 14px;border-left:3px solid var(--mark)}
details.add summary{cursor:pointer;color:var(--acc);font:15px var(--sans);padding:6px 0}
.pt{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.prow2{display:grid;grid-template-columns:1fr 28px;gap:8px}.stc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.lh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:32px 0 12px}.lh .t{font:600 16px var(--sans);color:var(--ink)}.lh .s{font:13px var(--sans);color:var(--sub);margin-top:2px}.lh button{padding:6px 14px;font-size:14px;white-space:nowrap}
.ea{display:block;width:100%;text-align:left;border:1px dashed var(--line);background:transparent;color:var(--sub);font:15px var(--sans);padding:16px 18px;border-radius:6px;cursor:pointer}.ea:hover{border-color:var(--acc);color:var(--acc)}
.en{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}.en textarea{border:0;background:transparent;padding:6px 0;resize:vertical}.en .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.fq{margin:8px 0 12px;padding:6px 14px;border-left:3px solid var(--acc);color:var(--ink);font-size:16px}.fl{font:12px var(--sans);color:var(--sub);margin-top:10px}
details.more{margin-top:10px}details.more summary{cursor:pointer;color:var(--acc);font:14px var(--sans);padding:6px 0}
.tg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}.tag{font:12px var(--sans);padding:2px 8px;border:1px solid var(--acc);border-radius:12px;color:var(--acc);background:transparent;display:inline-flex;align-items:center;gap:4px}.tag button{background:none;border:0;color:inherit;cursor:pointer;padding:0 0 0 2px;font-size:11px}.tag.sug{border-style:dashed;cursor:pointer;opacity:.9}
.tpick{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:12px}
.sbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.sbar input{flex:1 1 220px;width:auto}.sbar select{flex:0 1 150px;width:auto}
.sh{display:flex;align-items:center;gap:8px;margin:30px 0 12px;font:600 15px var(--sans);color:var(--ink)}.sh i{width:9px;height:9px;border-radius:50%;background:var(--acc);display:inline-block}.sh b{font-weight:400;color:var(--sub);font-size:13px}.sh-done i{background:var(--sub)}.sh-want i{background:transparent;border:1.5px solid var(--sub)}
.bk{display:block;text-decoration:none;color:inherit}.bk:hover .rt{color:var(--acc)}
.bk-r{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;padding:14px 16px;margin-bottom:12px}.bk-t{display:flex;justify-content:space-between;align-items:baseline;gap:12px}.bk-t .rt{font-size:20px}.go{font:13px var(--sans);color:var(--acc);white-space:nowrap}.bk-n{font:13px var(--sans);color:var(--sub);margin-top:8px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.bk-d{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.bk-d .ck{color:var(--sub);font:14px var(--sans);margin-top:3px}.bk-d .rt{font-size:16px;font-weight:400}
.bk-w{padding:8px 12px;border:1px dashed var(--line);border-radius:6px;margin-bottom:8px;color:var(--sub)}.bk-w .rt{font-size:15px;font-weight:400}
.rv{background:var(--mark);border-radius:8px;padding:16px 20px;margin-bottom:22px}.rv-h{font:600 12px var(--sans);letter-spacing:.08em;color:var(--sub);margin-bottom:8px}.rv blockquote{margin:0 0 8px;padding:0;border:0;font-size:18px;line-height:1.7;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.rv .lnk{font-size:14px;color:var(--acc)}.rv .lnk::after{content:' ›'}
.sh{margin:34px 0 14px}.sh span{font-size:17px;font-weight:600;padding:4px 14px;border-radius:16px;background:var(--acc);color:var(--acc-ink)}.sh b{font-size:15px}.sh i{display:none}
.sh-done span{background:var(--done);color:#fff}.sh-want span{background:transparent;color:var(--sub);border:1.5px dashed var(--sub)}
.bk .meta{font-size:14px}
.bk-r{background:var(--acc-bg);border:1px solid var(--acc);border-left:8px solid var(--acc);padding:18px 20px;margin-bottom:14px}.bk-t .rt{font-size:24px}.go{background:var(--acc);color:var(--acc-ink);padding:5px 14px;border-radius:16px;font-size:14px}.bk-n{font-size:15px;margin-top:10px}
.bk-d{background:var(--done-bg);border:0;border-left:6px solid var(--done);border-radius:6px;padding:14px 16px;margin-bottom:10px;align-items:center}.bk-d .ck{width:28px;height:28px;border-radius:50%;background:var(--done);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;margin:0;flex:none}.bk-d .rt{font-size:21px;font-weight:600}
.bk-w .rt{font-size:17px}
.en.qa{background:var(--coach-bg);border:1px solid var(--coach);border-left:6px solid var(--coach);padding:14px 16px}
.qa .qh{display:flex;justify-content:space-between;align-items:center;gap:12px}.qbadge{background:var(--coach);color:#fff;font:600 13px var(--sans);padding:3px 12px;border-radius:14px;white-space:nowrap}
.qa .q{background:transparent;padding:0;margin:14px 0 8px;font-size:18px;font-weight:600;color:var(--ink)}
.qa textarea{border:1px solid var(--coach)!important;background:var(--bg)!important}.qa .fq{border-left-color:var(--coach)}
.chip.coach{border-color:var(--coach);color:var(--coach)}.chip.coach.on{background:var(--coach);border-color:var(--coach);color:#fff}
#bcoach{border-color:var(--coach);color:var(--coach)}#bcoach:hover{background:var(--coach-bg)}[data-ask]{color:var(--coach)!important}
#nf{align-items:center;gap:10px}#nf .chip{font:15px/1.4 var(--sans);padding:8px 18px;border-radius:18px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:auto;margin:0;box-sizing:border-box}#nf .chip span{margin-left:0!important}
.soft{opacity:.55}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);min-width:270px;padding:6px}.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:6px;cursor:pointer;font:600 15px var(--sans);color:var(--ink)}.menu button small{display:block;font:400 12px var(--sans);color:var(--sub);margin-top:2px}.menu button:hover{background:var(--bg)}#nadd::after{content:' ▾';font-size:12px}
.demobar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--mark);padding:10px 14px;border-radius:6px;margin:-12px 0 18px;font:13px var(--sans)}.demobar span{flex:1 1 240px}.demobar .pri{padding:6px 14px;font-size:13px}
.back{display:inline-block;font:15px var(--sans);color:var(--acc);text-decoration:none;margin-bottom:14px;padding:4px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}.tabs .chip{white-space:nowrap}a.chip{text-decoration:none;display:inline-block}
.xo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.xp{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:24px;max-width:420px;width:100%}.xf{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
#xroot{position:fixed;left:-99999px;top:0;width:760px;padding:48px 56px;background:#fff;color:#1D2A2B;font:18px/1.9 "Noto Serif SC","Songti SC",serif}#xroot h1{font-size:30px;margin:0 0 8px}#xroot h2{font-size:24px;margin:40px 0 4px;border-top:1px solid #ccc;padding-top:24px}#xroot h3{font-size:16px;color:#2F5D58;margin:22px 0 6px;font-family:sans-serif}#xroot p{margin:6px 0}#xroot .m{color:#6b7776;font:14px sans-serif}#xroot blockquote{margin:10px 0;padding-left:16px;border-left:3px solid #C9BE92}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;margin-top:36px}.sechead h2{margin:0 0 10px}
.prow{display:grid;grid-template-columns:1fr 104px 28px;gap:8px;margin-bottom:8px;align-items:start}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.chip{font:13px var(--sans);padding:4px 14px;border:1px solid var(--line);border-radius:14px;background:none;color:var(--sub);cursor:pointer}.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
@media (max-width:520px){.grid{grid-template-columns:1fr}.qrow{grid-template-columns:1fr 70px 30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>书房</h1><nav id="nav"></nav><span class="meta" id="sync" aria-live="polite"></span><button class="lnk" id="lo" hidden>退出登录</button><button class="lnk" id="lang" aria-label="语言 / Language">EN</button></header>
<div id="demobar" class="demobar" hidden><span>你正在体验示例：数据只保存在这台设备上，AI 功能未开通。</span><button class="lnk" id="demoreset">重置示例</button><button class="pri" id="demoexit">登录 / 注册</button></div>
<main id="app"></main>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let KEY='shufang.v1';let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return mem||{books:[],reviews:[]}}
let S=load();
function flash(){const e=document.getElementById('svst');if(e)e.textContent='已保存 '+new Date().toTimeString().slice(0,5)}
function save(){mem=S;touch();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}flash()}
const today=()=>new Date().toISOString().slice(0,10);
const rich=t=>esc(t).replace(/\[\[([^\]]+)\]\]/g,(m,n)=>'<a class="cn" href="#/concept/'+encodeURIComponent(n.trim())+'">'+n.trim()+'</a>').replace(/\n/g,'<br>');
const concepts=r=>{const o=[];((r.thought||'')+' '+(r.action||'')).replace(/\[\[([^\]]+)\]\]/g,(m,n)=>o.push(n.trim()));(r.tags||[]).forEach(t=>o.push(t));return [...new Set(o)]};
const book=id=>S.books.find(b=>b.id===id);
const revs=id=>S.reviews.filter(r=>r.bookId===id).sort((a,b)=>b.date.localeCompare(a.date));
const STATUS={reading:'在读',done:'读完',want:'想读'};
let sample=null,downloads=null,assetsApi=null,canOcr=false;
downloads={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}};
const b64=blob=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const u=String(r.result);ok({media_type:blob.type||'image/jpeg',data:u.slice(u.indexOf(',')+1)})};r.onerror=no;r.readAsDataURL(blob)});
async function aiCall(body,signal){const {data}=await sb.auth.getSession();const tok=data.session&&data.session.access_token;let r;try{r=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(tok||'')},body:JSON.stringify(body),signal})}catch(e){const er=new Error('network');er.code=e&&e.name==='AbortError'?'cancelled':'upstream_error';throw er}
let j={};try{j=await r.json()}catch(e){}if(!r.ok){const er=new Error(j.error||'ai');er.code=j.code||(r.status===429?'rate_limited':r.status===401?'session_expired':r.status===504?'upstream_error':'upstream_error');throw er}return j}
sample=async(prompt,opts)=>{opts=opts||{};const body={prompt,tier:opts.modelTier==='quick'?'quick':'default'};if(opts.images&&opts.images.length)body.images=await Promise.all(opts.images.map(b64));const j=await aiCall(body,opts.signal);if(opts.onText)opts.onText({text:j.text});return {text:j.text}};
sample.json=async(prompt,opts)=>{const j=await aiCall({prompt,tier:'quick',json:true});try{const m=j.text.match(/[\[{][\s\S]*[\]}]/);return JSON.parse(m?m[0]:j.text)}catch(e){const er=new Error('invalid_json');er.code='invalid_json';throw er}};
sample.limits=async()=>({images:true});canOcr=true;
const sigCache={};
async function signedUrl(path){if(sigCache[path]&&sigCache[path].t>Date.now())return sigCache[path].u;const {data,error}=await sb.storage.from('photos').createSignedUrl(path,3600);if(error||!data)throw error||new Error('sign');sigCache[path]={u:data.signedUrl,t:Date.now()+3000*1000};return data.signedUrl}
function hydrateImgs(){document.querySelectorAll('img[data-sp]').forEach(async im=>{if(im.dataset.done)return;im.dataset.done='1';try{im.src=await signedUrl(im.dataset.sp)}catch(e){im.alt='图片加载失败'}})}
new MutationObserver(()=>hydrateImgs()).observe(document.body,{childList:true,subtree:true});
assetsApi={upload:async blob=>{const path=me+'/'+uid()+'.jpg';const {error}=await sb.storage.from('photos').upload(path,blob,{contentType:'image/jpeg'});if(error)throw error;return {id:path}},delete:async id=>{await sb.storage.from('photos').remove([id])}};


function nav(h){const on=k=>h.startsWith(k)?' class="on"':'';
$('#nav').innerHTML='<a href="#/"'+(h==='#/'||h===''||h.startsWith('#/book')||h.startsWith('#/edit')?' class="on"':'')+'>书架</a>'+(allNotes().length>=3?'<a href="#/time"'+(h.startsWith('#/time')||h.startsWith('#/concept')?' class="on"':'')+'>回顾</a>':'')+(downloads?'<button class="lnk" id="exp">导出</button>':'');
const e=$('#exp');if(e)e.onclick=openExport}
function exportMd(){let md='# 书房\n\n';S.books.forEach(b=>{md+='## '+b.title+(b.author?'（'+b.author+(b.country?'，'+b.country:'')+'）':'')+'\n\n'+(b.category?'分类：'+b.category+'\n\n':'');[['内容简介','summary'],['核心观点','points'],['我最喜欢的话','favs'],['我的思考与延伸','thought'],['我会怎么做','action']].forEach(([l,k])=>{const v=k==='thought'?(b.thought||b.note):k==='points'?getPts(b).filter(p=>p.text.trim()).map(p=>'- '+p.text+(p.stance?'（立场：'+p.stance+'）':'')+(p.note?'——'+p.note:'')).join('\n'):k==='favs'?getFvs(b).filter(q=>q.text.trim()).map(q=>'> '+q.text+(q.page?'（p.'+q.page+'）':'')+(q.note?'——'+q.note:'')).join('\n'):b[k];if(v)md+='**'+l+'**\n\n'+v+'\n\n'});if((b.qa||[]).length)md+='**教练提问与我的回答**\n\n'+b.qa.map(x=>x.q+'\n\n回答：'+(x.a||'（未回答）')).join('\n\n')+'\n\n';revs(b.id).reverse().forEach(r=>{md+='### '+(r.chapter||'摘录与批注')+' · '+r.date+'\n\n';(r.quotes||[]).forEach(q=>md+='> '+q.text+(q.page?' （p.'+q.page+'）':'')+'\n\n');if(r.thought)md+='**思考**\n\n'+r.thought+'\n\n';if(r.action)md+='**行动**\n\n'+r.action+'\n\n'})});
downloads.save({filename:'书房.md',data:new Blob([md],{type:'text/markdown'})}).catch(()=>{})}

function route(){const h=location.hash||'#/';$('#demobar').hidden=!demo||!!me;if(!me&&!demo){$('#nav').innerHTML='';$('#app').innerHTML=vLogin();bindLogin();return}nav(h);const p=h.split('/').map(decodeURIComponent);const a=$('#app');
if(p[1]==='book')a.innerHTML=vBook(p[2]);
else if(p[1]==='edit'){a.innerHTML=vEdit(p[2],p[3]);bindEdit(p[2],p[3])}
else if(p[1]==='time')a.innerHTML=vTime();
else if(p[1]==='concepts')a.innerHTML=vConcepts();
else if(p[1]==='concept')a.innerHTML=vConcept(p[2]);
else{a.innerHTML=vHome();bindHome()}
document.querySelectorAll('.bf').forEach(el=>el.oninput=()=>{const b=book(el.dataset.id);if(b){b[el.dataset.f]=el.value;if(['thought','action'].includes(el.dataset.f))b.updated=today();save()}});
if(p[1]==='book'){bindStream(p[2]);bindCoach(p[2])}
window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

const RX=[[/^已保存 (\d\d:\d\d)$/,'Saved $1'],[/^出现在 (\d+) 本书、(\d+) 篇复盘$/,'In $1 book(s) · $2 note(s)'],[/^已导出：(.*)$/,'Exported: $1'],[/^已导入 (\d+) 本书$/,'Imported $1 book(s)'],[/^(\d{4})年(\d{2})月$/,'$1-$2'],[/^(\d{4})年$/,'$1'],[/^找到 (\d+) 本书 ·$/,'Found $1 book(s) ·'],[/^开始于 (\d{4})年(\d{2})月$/,'Started $1-$2'],[/^开始于 (\d{4})年$/,'Started $1'],[/^读完于 (\d{4})年(\d{2})月$/,'Finished $1-$2'],[/^读完于 (\d{4})年$/,'Finished $1']];
function trText(s,el){if(LANG!=='en')return s;const k=s.trim();if(!k)return s;if(EN[k])return s.replace(k,EN[k]);for(const [r,v] of RX)if(r.test(k))return s.replace(k,k.replace(r,v));if(el&&el.closest&&el.closest('.meta')){let o=s;SUB.forEach(([a,b])=>{o=o.split(a).join(b)});return o}return s}
function trNode(root){if(LANG!=='en'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];while(w.nextNode())L.push(w.currentNode);L.forEach(n=>{const p=n.parentElement;if(!p||p.closest('textarea,script,style'))return;const t=trText(n.nodeValue,p);if(t!==n.nodeValue)n.nodeValue=t});
if(root.querySelectorAll)root.querySelectorAll('[placeholder],[aria-label],[alt]').forEach(e=>['placeholder','aria-label','alt'].forEach(a=>{const v=e.getAttribute(a);if(v&&EN[v.trim()])e.setAttribute(a,EN[v.trim()])}))}
new MutationObserver(ms=>{if(LANG!=='en')return;ms.forEach(m=>{if(m.type==='characterData'){const p=m.target.parentElement;if(p&&!p.closest('textarea')){const t=trText(m.target.nodeValue,p);if(t!==m.target.nodeValue)m.target.nodeValue=t}}else m.addedNodes.forEach(n=>{if(n.nodeType===1)trNode(n);else if(n.nodeType===3&&n.parentElement)trNode(n.parentElement)})})}).observe(document.body,{childList:true,subtree:true,characterData:true});
